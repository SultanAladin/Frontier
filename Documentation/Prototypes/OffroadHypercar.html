<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dakar Off-Road Hypercar — Low-Poly 3D Game Asset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');
  :root{--card:rgba(18,20,26,.86);--card2:rgba(32,35,44,.92);--ink:#eef0f5;--mut:#9aa1b0;--line:rgba(255,255,255,.11);--accent:#ef3d26}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#d6e3ea;color:var(--ink);font:400 13px/1.4 'Outfit',system-ui,sans-serif}
  #canvasWrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  #badge{position:fixed;top:16px;left:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(12px);pointer-events:none;z-index:10;min-width:220px}
  #badge .eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#ff5a43;font-weight:600}
  #badge .title{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-top:1px}
  #badge .sub{font-size:11.5px;color:var(--mut);margin-top:2px;font-family:ui-monospace,Menlo,monospace}

  #stats{position:fixed;left:18px;bottom:16px;display:flex;gap:8px;z-index:10;pointer-events:none;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;backdrop-filter:blur(12px)}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
  .stat .v{font-size:14px;font-weight:500;font-family:ui-monospace,Menlo,monospace;color:#fff}
  .stat .v small{font-size:10.5px;color:var(--mut);font-weight:400;margin-left:3px}

  #views{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;backdrop-filter:blur(12px);z-index:10}
  #views button{border:0;background:transparent;color:var(--mut);padding:6px 13px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  #views button:hover{color:#fff;background:rgba(255,255,255,.08)}
  #views button.on{background:#fff;color:#111;font-weight:500}

  #panel{position:fixed;top:16px;right:18px;width:274px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;backdrop-filter:blur(14px);z-index:10;display:flex;flex-direction:column;gap:12px}
  #panel::-webkit-scrollbar{width:5px} #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}
  .sec{display:flex;flex-direction:column;gap:7px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0;padding-bottom:0}
  .sec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600}

  .row .val{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);min-width:44px;text-align:right}
  input[type=range]{flex:1;accent-color:#fff;cursor:pointer;height:4px}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}

  .swatch:hover{transform:scale(1.1)}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:9px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;transition:all .14s}
  .pill:hover{color:#fff;background:rgba(255,255,255,.1)}
  .pill.on{background:#fff;color:#111;border-color:#fff;font-weight:500}
  .btns{display:flex;gap:6px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.primary{background:#fff;color:#111;border-color:#fff}

  @media(max-width:780px){#panel{width:228px;font-size:11.5px}#views{bottom:64px}}

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// =================================================================================================
//  SCENE, CAMERA, CONCEPT-ART STUDIO BACKDROP & SMOOTH ZOOM
// =================================================================================================
const wrap = document.getElementById('canvasWrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.08, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2.0;
controls.maxDistance = 15.0;

let zoomTargetDist = null;
function normalizeWheelDelta(e) {
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;
  else if (e.deltaMode === 2) d *= 400;
  return THREE.MathUtils.clamp(d, -120, 120);
}
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault(); e.stopImmediatePropagation();
  const dy = normalizeWheelDelta(e);
  if (!dy) return;
  const cur = zoomTargetDist ?? camera.position.distanceTo(controls.target);
  zoomTargetDist = THREE.MathUtils.clamp(cur * Math.exp(dy * 0.0012), controls.minDistance, controls.maxDistance);
}, { passive: false, capture: true });
controls.addEventListener('start', () => { zoomTargetDist = null; });

// Crisp daylight studio lighting matching the concept illustration
const hemi = new THREE.HemisphereLight('#f6fbff', '#8ea0ad', 0.85);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight('#fffdf8', 2.25);
keyLight.position.set(5.2, 8.8, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 2; keyLight.shadow.camera.far = 22;
keyLight.shadow.camera.left = -4.0; keyLight.shadow.camera.right = 4.0;
keyLight.shadow.camera.top = 4.0; keyLight.shadow.camera.bottom = -4.0;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight('#d8ecff', 0.9);
fillLight.position.set(-5.8, 4.2, -3.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#ffffff', 0.8);
rimLight.position.set(-2.5, 4.8, -7.2);
scene.add(rimLight);

const floorMat = new THREE.MeshStandardMaterial({ color: '#cfdde5', roughness: 0.55, metalness: 0.04 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(28, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uTop: { value: new THREE.Color('#c8dae3') },
    uMid: { value: new THREE.Color('#d7e5ec') },
    uBot: { value: new THREE.Color('#e1ecf2') },
  },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop,uMid,uBot; varying vec3 vPos;
    void main(){
      float h = clamp(normalize(vPos).y, -0.2, 1.0);
      vec3 c = h < 0.25 ? mix(uBot, uMid, smoothstep(-0.08, 0.25, h)) : mix(uMid, uTop, smoothstep(0.25, 0.85, h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(28, 32, 20), domeMat));

const gridHelper = new THREE.GridHelper(16, 32, '#8da0ad', '#b7c7d1');
gridHelper.position.y = 0.002;
gridHelper.visible = false;
scene.add(gridHelper);

// =================================================================================================
//  MATERIALS & PROCEDURAL RALLY TIRE SIDEWALL TEXTURE
// =================================================================================================
function makeSidewallTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1d1f23'; ctx.fillRect(0, 0, 512, 512);
  ctx.translate(256, 256);
  // Subtle sidewall molding rings
  ctx.strokeStyle = '#2a2d33'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 210, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 152, 0, Math.PI * 2); ctx.stroke();
  // Bold white Dakar rally sidewall lettering on top & bottom arcs
  const drawArcText = (txt, ang0, step) => {
    ctx.fillStyle = '#eef2f5';
    ctx.font = 'bold 28px Outfit, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < txt.length; i++) {
      ctx.save();
      ctx.rotate(ang0 + i * step);
      ctx.fillText(txt[i], 0, -182);
      ctx.restore();
    }
  };
  drawArcText('RALLY  RAID', -0.72, 0.145);
  drawArcText('OFF-ROAD  X', Math.PI - 0.72, 0.145);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const MATS = {
  body:       new THREE.MeshStandardMaterial({ color: '#dc2a19', roughness: 0.28, metalness: 0.12, flatShading: true }),
  stripe:     new THREE.MeshStandardMaterial({ color: '#e6edf0', roughness: 0.34, metalness: 0.06, flatShading: true }),
  accentYel:  new THREE.MeshStandardMaterial({ color: '#f2c828', roughness: 0.32, metalness: 0.15, flatShading: true }),
  accentBlue: new THREE.MeshStandardMaterial({ color: '#1b477d', roughness: 0.42, metalness: 0.08, flatShading: true }),
  carbon:     new THREE.MeshStandardMaterial({ color: '#1d2026', roughness: 0.52, metalness: 0.25, flatShading: true }),
  skid:       new THREE.MeshStandardMaterial({ color: '#3b4048', roughness: 0.46, metalness: 0.62, flatShading: true }),
  chassis:    new THREE.MeshStandardMaterial({ color: '#15171c', roughness: 0.55, metalness: 0.35, flatShading: true }),
  steel:      new THREE.MeshStandardMaterial({ color: '#c4cbd4', roughness: 0.25, metalness: 0.88, flatShading: true }),
  wingSilver: new THREE.MeshStandardMaterial({ color: '#d4dce2', roughness: 0.30, metalness: 0.45, flatShading: true }),
  glass:      new THREE.MeshStandardMaterial({ color: '#161b22', roughness: 0.08, metalness: 0.45, transparent: true, opacity: 0.86, flatShading: true }),
  lensDark:   new THREE.MeshStandardMaterial({ color: '#11141a', roughness: 0.14, metalness: 0.55, flatShading: true }),
  amberLens:  new THREE.MeshStandardMaterial({ color: '#d49d28', emissive: '#ffaa18', emissiveIntensity: 1.05, roughness: 0.14, metalness: 0.2, transparent: true, opacity: 0.82, flatShading: true }),
  drlWhite:   new THREE.MeshStandardMaterial({ color: '#fff8e8', emissive: '#ffe0a6', emissiveIntensity: 2.2, roughness: 0.12 }),
  tailRed:    new THREE.MeshStandardMaterial({ color: '#ff2020', emissive: '#ff1515', emissiveIntensity: 2.4, roughness: 0.2 }),
  grilleMesh: new THREE.MeshStandardMaterial({ color: '#181c24', roughness: 0.44, metalness: 0.56, flatShading: true }),
  exhaustTi:  new THREE.MeshStandardMaterial({ color: '#7a8da8', roughness: 0.22, metalness: 0.92, flatShading: true }),
  engineGold: new THREE.MeshStandardMaterial({ color: '#cba036', roughness: 0.30, metalness: 0.78, flatShading: true }),
  towRed:     new THREE.MeshStandardMaterial({ color: '#ff2618', roughness: 0.24, metalness: 0.65, flatShading: true }),
  rubber:     new THREE.MeshStandardMaterial({ color: '#1d1f23', roughness: 0.86, metalness: 0.04, flatShading: true }),
  sidewall:   new THREE.MeshStandardMaterial({ map: makeSidewallTex(), roughness: 0.84, metalness: 0.04 }),
  rimBlack:   new THREE.MeshStandardMaterial({ color: '#191b20', roughness: 0.36, metalness: 0.52, flatShading: true }),
  coilBlue:   new THREE.MeshStandardMaterial({ color: '#2466c4', roughness: 0.34, metalness: 0.55, flatShading: true }),
  interior:   new THREE.MeshStandardMaterial({ color: '#6b6458', roughness: 0.78, metalness: 0.05, flatShading: true }),
};
Object.entries(MATS).forEach(([k, m]) => { m.name = k; });

// =================================================================================================
//  HARD-SURFACE LOFT & MIRRORED PANEL GEOMETRY HELPERS (AUTO-OUTWARD NORMALS!)
// =================================================================================================
function buildLoft(rings, closeLoop = false, capEnds = true, flipOpen = false) {
  const nR = rings.length, nP = rings[0].length;
  const pos = [], idx = [];
  for (let i = 0; i < nR; i++) {
    for (let j = 0; j < nP; j++) pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
  }
  const jMax = closeLoop ? nP : nP - 1;
  for (let i = 0; i < nR - 1; i++) {
    for (let j = 0; j < jMax; j++) {
      const jn = (j + 1) % nP;
      const a = i * nP + j, b = i * nP + jn, c = (i + 1) * nP + jn, d = (i + 1) * nP + j;
      idx.push(a, b, c, a, c, d);
    }
  }
  if (capEnds && closeLoop) {
    for (const end of [0, nR - 1]) {
      let cx = 0, cy = 0, cz = 0;
      for (let j = 0; j < nP; j++) { cx += rings[end][j][0]; cy += rings[end][j][1]; cz += rings[end][j][2]; }
      const cIdx = pos.length / 3;
      pos.push(cx / nP, cy / nP, cz / nP);
      for (let j = 0; j < nP; j++) {
        const a = end * nP + j, b = end * nP + (j + 1) % nP;
        if (end === 0) idx.push(cIdx, b, a);
        else idx.push(cIdx, a, b);
      }
    }
  }
  let shouldFlip = flipOpen;
  if (closeLoop && capEnds) {
    let vol6 = 0;
    for (let t = 0; t < idx.length; t += 3) {
      const ia = idx[t] * 3, ib = idx[t + 1] * 3, ic = idx[t + 2] * 3;
      const ax = pos[ia], ay = pos[ia + 1], az = pos[ia + 2];
      const bx = pos[ib], by = pos[ib + 1], bz = pos[ib + 2];
      const cx = pos[ic], cy = pos[ic + 1], cz = pos[ic + 2];
      vol6 += ax * (by * cz - bz * cy) + ay * (bz * cx - bx * cz) + az * (bx * cy - by * cx);
    }
    if (vol6 < 0) shouldFlip = true;
  }
  if (shouldFlip) {
    for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const uvs = new Float32Array((pos.length / 3) * 2);
  for (let i = 0; i < pos.length / 3; i++) {
    uvs[i * 2] = pos[i * 3 + 2] * 0.4 + pos[i * 3] * 0.2;
    uvs[i * 2 + 1] = pos[i * 3 + 1] * 0.4;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  return g;
}

// Build a mirrored pair of closed lofts (rings defined for right side +X; automatically mirrored cleanly for -X!)
function addMirrorLoft(parent, ringsRight, mat, nameBase) {
  const mR = new THREE.Mesh(buildLoft(ringsRight, true, true), mat);
  mR.name = nameBase + '_R';
  const ringsLeft = ringsRight.map(r => r.map(p => [-p[0], p[1], p[2]]));
  const mL = new THREE.Mesh(buildLoft(ringsLeft, true, true), mat);
  mL.name = nameBase + '_L';
  parent.add(mR, mL);
}

// Mirrored extruded side-silhouette panel with optional top tumblehome taper
function makeSidePanel(ptsZY, xIn, xOut, mat, topTaper = 0, nameBase = 'Panel') {
  const grp = new THREE.Group(); grp.name = nameBase;
  const yMin = Math.min(...ptsZY.map(p => p[1])), yMax = Math.max(...ptsZY.map(p => p[1]));
  const shape = new THREE.Shape();
  ptsZY.forEach(([z, y], i) => i ? shape.lineTo(z, y) : shape.moveTo(z, y));
  shape.closePath();
  const thick = Math.abs(xOut - xIn);
  for (const sgn of [1, -1]) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.012, bevelSegments: 1 });
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const sz = p.getX(i), sy = p.getY(i), sx = p.getZ(i);
      const tH = THREE.MathUtils.clamp((sy - yMin) / Math.max(0.01, yMax - yMin), 0, 1);
      const xBase = xIn + sx - topTaper * tH * (sx / Math.max(0.01, thick));
      p.setXYZ(i, sgn * xBase, sy, sz);
    }
    if (sgn > 0) {
      const idx = geo.index;
      if (idx) {
        for (let i = 0; i < idx.count; i += 3) { const b = idx.getX(i + 1), c = idx.getX(i + 2); idx.setX(i + 1, c); idx.setX(i + 2, b); }
      } else {
        for (let i = 0; i < p.count; i += 3) {
          const x1 = p.getX(i + 1), y1 = p.getY(i + 1), z1 = p.getZ(i + 1);
          p.setXYZ(i + 1, p.getX(i + 2), p.getY(i + 2), p.getZ(i + 2));
          p.setXYZ(i + 2, x1, y1, z1);
        }
      }
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.name = nameBase + (sgn > 0 ? '_R' : '_L');
    grp.add(mesh);
  }
  return grp;
}

function makeTube(a, b, r = 0.024, mat = MATS.chassis, segs = 8) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, Math.max(0.005, dir.length()), segs), mat);
  m.position.addVectors(va, vb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;

// Helper: sculpted cambered GT3 airfoil wing blade with upturned Gurney flap & subtle gullwing arch!
function buildAirfoilWing(halfSpan, chord, yBase, zLead, archDip, sweepBack, mat, name) {
  const xs = [-halfSpan, -halfSpan * 0.65, -halfSpan * 0.28, 0, halfSpan * 0.28, halfSpan * 0.65, halfSpan];
  const rings = xs.map(x => {
    const t = Math.abs(x) / halfSpan;
    const y = yBase + archDip * t * t;
    const z0 = zLead - sweepBack * t * t;
    const c = chord * (1.0 - 0.08 * t * t);
    // 8-point cambered hypercar airfoil cross-section (thick curved leading edge -> thin trailing edge -> upturned Gurney flap!)
    return [
      [x, y + 0.012, z0],                 // rounded leading nose
      [x, y + 0.036, z0 - c * 0.22],      // upper cambered peak
      [x, y + 0.044, z0 - c * 0.58],      // upper mid-chord
      [x, y + 0.078, z0 - c * 1.00],      // crisp upturned Gurney flap tip!
      [x, y + 0.056, z0 - c * 1.02],      // trailing back face
      [x, y + 0.022, z0 - c * 0.68],      // concave high-downforce underside
      [x, y - 0.004, z0 - c * 0.28],      // underside belly
      [x, y - 0.008, z0 - c * 0.04],      // lower leading chin
    ];
  });
  const m = new THREE.Mesh(buildLoft(rings, true, true), mat);
  m.name = name;
  return m;
}

// -------------------------------------------------------------------------------------------------
// 7. MASSIVE CHUNKY DAKAR RALLY WHEELS (10-SPOKE BLACK RIMS + WHITE-LETTERED MUD TIRES) + TUCKED SPARE TIRE!
// -------------------------------------------------------------------------------------------------
function buildDakarWheel(isLeft, scale = 1.0) {
  const wheel = new THREE.Group();
  const s = isLeft ? -1 : 1;
  const rT = R_TIRE * scale, hw = (W_TIRE * 0.5) * scale;
  const rIn = 0.245 * scale, rMid = 0.355 * scale, rOut = rT - 0.024 * scale;

  // Tire carcass torus
  const prof = [
    [rIn, -hw * 0.80], [rMid, -hw * 1.02], [rOut - 0.02 * scale, -hw * 0.88],
    [rOut, -hw * 0.70], [rOut, hw * 0.70], [rOut - 0.02 * scale, hw * 0.88],
    [rMid, hw * 1.02], [rIn, hw * 0.80], [rIn, -hw * 0.80],
  ].map(([r, x]) => new THREE.Vector2(r, x));
  const tireGeo = new THREE.LatheGeometry(prof, 26);
  tireGeo.rotateZ(-Math.PI / 2);
  const tireMesh = new THREE.Mesh(tireGeo, MATS.rubber);
  tireMesh.name = 'Tire_Carcass';
  wheel.add(tireMesh);

  // White-lettered sidewall discs slightly proud of upper sidewall for crisp "RALLY RAID" typography!
  const swRing = new THREE.RingGeometry(rIn * 1.01, rOut * 0.94, 26);
  const swOut = new THREE.Mesh(swRing, MATS.sidewall);
  swOut.rotation.y = s > 0 ? Math.PI / 2 : -Math.PI / 2;
  swOut.position.x = s * (hw * 0.98);
  swOut.name = 'Tire_SidewallDecal';
  wheel.add(swOut);

  // Merged chunky staggered Dakar mud-terrain tread lugs & side-biters (single mesh for clean GLB/OBJ export!)
  const N_LUG = 22;
  const lugPos = [], lugIdx = [];
  const tpl = {
    sh: new THREE.BoxGeometry(0.105 * scale, 0.032 * scale, 0.082 * scale),
    cn: new THREE.BoxGeometry(0.082 * scale, 0.028 * scale, 0.068 * scale),
    bt: new THREE.BoxGeometry(0.030 * scale, 0.066 * scale, 0.062 * scale),
  };
  const dummy = new THREE.Object3D(), tmpV = new THREE.Vector3();
  const addLug = (geo, px, py, pz, rx, ry, rz) => {
    dummy.position.set(px, py, pz); dummy.rotation.set(rx, ry, rz); dummy.updateMatrix();
    const base = lugPos.length / 3, sp = geo.attributes.position, si = geo.index;
    for (let k = 0; k < sp.count; k++) {
      tmpV.set(sp.getX(k), sp.getY(k), sp.getZ(k)).applyMatrix4(dummy.matrix);
      lugPos.push(tmpV.x, tmpV.y, tmpV.z);
    }
    for (let k = 0; k < si.count; k++) lugIdx.push(base + si.getX(k));
  };
  for (let i = 0; i < N_LUG; i++) {
    const a = (i / N_LUG) * Math.PI * 2, alt = (i % 2 === 0) ? 1 : -1;
    for (const side of [-1, 1]) {
      const aa = a + (side > 0 ? 0.5 / N_LUG * Math.PI * 2 : 0);
      addLug(tpl.sh, side * hw * 0.54, Math.cos(aa) * (rT - 0.012 * scale), Math.sin(aa) * (rT - 0.012 * scale), aa, side * 0.24, 0);
      addLug(tpl.bt, side * hw * 0.94, Math.cos(aa) * (rT - 0.064 * scale), Math.sin(aa) * (rT - 0.064 * scale), aa, 0, -side * 0.28);
    }
    addLug(tpl.cn, alt * 0.018 * scale, Math.cos(a) * (rT - 0.011 * scale), Math.sin(a) * (rT - 0.011 * scale), a, alt * 0.28, 0);
  }
  const mergedLugs = new THREE.BufferGeometry();
  mergedLugs.setAttribute('position', new THREE.Float32BufferAttribute(lugPos, 3));
  mergedLugs.setIndex(lugIdx);
  mergedLugs.computeVertexNormals();
  const lugMesh = new THREE.Mesh(mergedLugs, MATS.rubber);
  lugMesh.name = 'Tire_TreadLugs';
  wheel.add(lugMesh);

  // Matte-Black 10-Spoke Dakar Motorsport Rim (matching the photo!)
  const rim = new THREE.Group(); rim.name = 'Rim_10Spoke';
  const Rr = 0.252 * scale;
  const lip = new THREE.Mesh(new THREE.TorusGeometry(Rr - 0.01 * scale, 0.018 * scale, 8, 24), MATS.rimBlack);
  lip.rotation.y = Math.PI / 2; lip.position.x = s * hw * 0.72;
  rim.add(lip);
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(Rr - 0.012 * scale, Rr - 0.012 * scale, hw * 1.44, 20), MATS.chassis);
  drum.rotation.z = Math.PI / 2;
  rim.add(drum);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.072 * scale, 0.076 * scale, 0.07 * scale, 14), MATS.rimBlack);
  hub.rotation.z = Math.PI / 2; hub.position.x = s * hw * 0.42;
  rim.add(hub);
  const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.032 * scale, 0.032 * scale, 0.08 * scale, 12), MATS.steel);
  badge.rotation.z = Math.PI / 2; badge.position.x = s * hw * 0.44;
  rim.add(badge);
  // 10 crisp radial spokes + brake disc behind
  const spGeo = new THREE.BoxGeometry(0.028 * scale, (Rr - 0.065 * scale), 0.028 * scale);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const sp = new THREE.Mesh(spGeo, MATS.rimBlack);
    sp.position.set(s * hw * 0.56, Math.cos(a) * (Rr * 0.52), Math.sin(a) * (Rr * 0.52));
    sp.rotation.x = a;
    rim.add(sp);
  }
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(Rr * 0.74, Rr * 0.74, 0.02 * scale, 18), MATS.steel);
  disc.rotation.z = Math.PI / 2; disc.position.x = s * hw * 0.14;
  rim.add(disc);
  wheel.add(rim);
  return wheel;
}

function orientLink(m, a, b) {
  const d = new THREE.Vector3().subVectors(b, a);
  m.position.addVectors(a, b).multiplyScalar(0.5);
  m.scale.set(1, Math.max(0.01, d.length()), 1);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}

}

  const dy = RIG.susp;

  const rad = THREE.MathUtils.degToRad(RIG.steer);

  for (const lk of suspLinks) {
    const s = lk.s, z = lk.zAx;
    const hubT = new THREE.Vector3(s * (X_TRACK - 0.16), R_TIRE + 0.14, z);
    const hubB = new THREE.Vector3(s * (X_TRACK - 0.14), R_TIRE - 0.10, z);
    orientLink(lk.upF, new THREE.Vector3(s * 0.42, 0.72 + dy, z + 0.16), hubT);
    orientLink(lk.upR, new THREE.Vector3(s * 0.42, 0.72 + dy, z - 0.16), hubT);
    orientLink(lk.loF, new THREE.Vector3(s * 0.34, 0.54 + dy, z + 0.18), hubB);
    orientLink(lk.loR, new THREE.Vector3(s * 0.34, 0.54 + dy, z - 0.18), hubB);
    const shT = new THREE.Vector3(s * 0.52, 1.02 + dy, z);
    const shB = new THREE.Vector3(s * (X_TRACK - 0.24), R_TIRE - 0.04, z);
    orientLink(lk.shk, shT, shB);
    orientLink(lk.spr, shT.clone().lerp(shB, 0.26), shT.clone().lerp(shB, 0.76));
  }
}

function serializeOBJandMTL(root, mtlFilename) {
  root.updateMatrixWorld(true);
  const lines = [`# Dakar Off-Road Hypercar — Game Asset (metres, Y-up, +Z forward)`, `mtllib ${mtlFilename}`];
  const usedMats = new Map();
  let vOff = 1, vtOff = 1, vnOff = 1, meshIdx = 0;
  const v = new THREE.Vector3(), n = new THREE.Vector3(), nMat = new THREE.Matrix3();

  root.traverseVisible(obj => {
    if (!obj.isMesh || !obj.geometry) return;
    const g = obj.geometry, pos = g.attributes.position; if (!pos) return;
    const uv = g.attributes.uv, norm = g.attributes.normal;
    const mat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
    const matName = (mat && mat.name) ? mat.name : 'default';
    if (mat) usedMats.set(matName, mat);
    const parentName = obj.parent?.name ? obj.parent.name + '_' : '';
    const objName = (obj.name || `${parentName}Mesh_${String(++meshIdx).padStart(3, '0')}`).replace(/\s+/g, '_');
    lines.push(`o ${objName}`, `usemtl ${matName}`);
    const m = obj.matrixWorld; nMat.getNormalMatrix(m); const det = m.determinant();
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m); lines.push(`v ${v.x.toFixed(5)} ${v.y.toFixed(5)} ${v.z.toFixed(5)}`); }
    if (uv) for (let i = 0; i < uv.count; i++) lines.push(`vt ${uv.getX(i).toFixed(4)} ${uv.getY(i).toFixed(4)}`);
    if (norm) for (let i = 0; i < norm.count; i++) { n.fromBufferAttribute(norm, i).applyMatrix3(nMat).normalize(); lines.push(`vn ${n.x.toFixed(4)} ${n.y.toFixed(4)} ${n.z.toFixed(4)}`); }
    const fmt = idx => { const vi = idx + vOff; return uv && norm ? `${vi}/${idx + vtOff}/${idx + vnOff}` : norm ? `${vi}//${idx + vnOff}` : uv ? `${vi}/${idx + vtOff}` : `${vi}`; };
    const index = g.index, count = index ? index.count : pos.count;
    for (let i = 0; i < count; i += 3) {
      const a = index ? index.getX(i) : i, b = index ? index.getX(i + 1) : i + 1, c = index ? index.getX(i + 2) : i + 2;
      lines.push(det < 0 ? `f ${fmt(a)} ${fmt(c)} ${fmt(b)}` : `f ${fmt(a)} ${fmt(b)} ${fmt(c)}`);
    }
    vOff += pos.count; if (uv) vtOff += uv.count; if (norm) vnOff += norm.count;
  });

  const mtl = [`# Material Library for Dakar Off-Road Hypercar`];
  for (const [name, mat] of usedMats.entries()) {
    const c = mat.color || new THREE.Color(0.8, 0.8, 0.8);
    const e = mat.emissive && mat.emissiveIntensity > 0 ? mat.emissive : null;
    mtl.push(`newmtl ${name}`, `Kd ${c.r.toFixed(4)} ${c.g.toFixed(4)} ${c.b.toFixed(4)}`,
      `Ks ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)}`,
      `Ns ${Math.round((1 - (mat.roughness ?? 0.5)) * 200 + 10)}`);
    if (e) mtl.push(`Ke ${(e.r * mat.emissiveIntensity).toFixed(3)} ${(e.g * mat.emissiveIntensity).toFixed(3)} ${(e.b * mat.emissiveIntensity).toFixed(3)}`);
    mtl.push(`d ${mat.transparent ? mat.opacity.toFixed(2) : '1.0'}`, ``);
  }
  return { obj: lines.join('\n') + '\n', mtl: mtl.join('\n') };
}

  CAR.updateMatrixWorld(true);
  new GLTFExporter().parse(CAR, res => {
    dl('DakarOffroadHypercar.glb', new Blob([res], { type: 'model/gltf-binary' }));
    toast('Exported DakarOffroadHypercar.glb (Blender / Unity / Unreal)');
  }, err => toast('Export error: ' + err), { binary: true, onlyVisible: true });
};
document.getElementById('expObj').onclick = () => {
  const { obj, mtl } = serializeOBJandMTL(CAR, 'DakarOffroadHypercar.mtl');
  dl('DakarOffroadHypercar.obj', new Blob([obj], { type: 'text/plain' }));
  setTimeout(() => dl('DakarOffroadHypercar.mtl', new Blob([mtl], { type: 'text/plain' })), 250);
  toast('Exported DakarOffroadHypercar.obj + .mtl');
};

// =================================================================================================
//  RENDER LOOP
// =================================================================================================
let prevT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now;

  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 3.2);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  if (zoomTargetDist !== null) {
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length();
    const next = cur + (zoomTargetDist - cur) * (1 - Math.exp(-14 * dt));
    if (Math.abs(next - zoomTargetDist) < 0.002) { off.setLength(zoomTargetDist); zoomTargetDist = null; }
    else off.setLength(next);
    camera.position.copy(controls.target).add(off);
  }
  if (RIG.drive) {
    const spinStep = dt * 5.6;
    for (const w of Object.values(wheelPivots)) w.spin.rotation.x += spinStep;
  }
  if (RIG.turntable) CAR.rotation.y += dt * 0.35;

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
