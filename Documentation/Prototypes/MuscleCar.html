<style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// =================================================================================================
//  SCENE, CAMERA, CRISP AUTOMOTIVE STUDIO & SMOOTH DAMPED WHEEL ZOOM
// =================================================================================================
const wrap = document.getElementById('canvasWrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(31, innerWidth / innerHeight, 0.06, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1.4;
controls.maxDistance = 14.0;

let zoomTargetDist = null;
function normalizeWheelDelta(e) {
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;
  else if (e.deltaMode === 2) d *= 400;
  return THREE.MathUtils.clamp(d, -120, 120);
}
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault(); e.stopImmediatePropagation();
  const dy = normalizeWheelDelta(e);
  if (!dy) return;
  const cur = zoomTargetDist ?? camera.position.distanceTo(controls.target);
  zoomTargetDist = THREE.MathUtils.clamp(cur * Math.exp(dy * 0.0012), controls.minDistance, controls.maxDistance);
}, { passive: false, capture: true });
controls.addEventListener('start', () => { zoomTargetDist = null; });

// Studio Lighting (Crisp white photo-studio default matching both reference photos!)
const hemi = new THREE.HemisphereLight('#ffffff', '#b8c0cc', 1.05);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight('#fffaf2', 2.45);
keyLight.position.set(5.6, 8.2, 5.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 26;
const sc = 4.6;
keyLight.shadow.camera.left = -sc; keyLight.shadow.camera.right = sc;
keyLight.shadow.camera.top = sc; keyLight.shadow.camera.bottom = -sc;
keyLight.shadow.bias = -0.00035;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight('#dbe8ff', 0.95);
fillLight.position.set(-6.0, 3.8, 3.2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#fff2e4', 1.25);
rimLight.position.set(-2.4, 4.4, -7.2);
scene.add(rimLight);

const floorMat = new THREE.MeshStandardMaterial({ color: '#eef1f5', roughness: 0.48, metalness: 0.04 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(28, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uTop: { value: new THREE.Color('#dfe5ec') },
    uMid: { value: new THREE.Color('#eef2f6') },
    uBot: { value: new THREE.Color('#f7f9fb') },
  },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop,uMid,uBot; varying vec3 vPos;
    void main(){
      float h = clamp(normalize(vPos).y, -0.2, 1.0);
      vec3 c = h < 0.25 ? mix(uBot, uMid, smoothstep(-0.08, 0.25, h)) : mix(uMid, uTop, smoothstep(0.25, 0.85, h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(28, 32, 20), domeMat));

const gridHelper = new THREE.GridHelper(16, 32, '#5a6474', '#2c3240');
gridHelper.position.y = 0.002;
gridHelper.visible = false;
scene.add(gridHelper);

// =================================================================================================
//  MATERIALS & PROCEDURAL MUSCLE TIRE SIDEWALL TEXTURE
// =================================================================================================
function makeSidewallTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1b1d21'; ctx.fillRect(0, 0, 512, 512);
  ctx.translate(256, 256);
  ctx.strokeStyle = '#282b32'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 212, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 152, 0, Math.PI * 2); ctx.stroke();
  const drawArcText = (txt, ang0, step) => {
    ctx.fillStyle = '#e5e9ef';
    ctx.font = 'bold 26px Outfit, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < txt.length; i++) {
      ctx.save(); ctx.rotate(ang0 + i * step); ctx.fillText(txt[i], 0, -184); ctx.restore();
    }
  };
  drawArcText('GOOD YEAR', -0.62, 0.145);
  drawArcText('TRANS-AM', Math.PI - 0.56, 0.148);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const MATS = {
  body:        new THREE.MeshStandardMaterial({ color: '#e62417', roughness: 0.25, metalness: 0.14, flatShading: true }),
  flareBlack:  new THREE.MeshStandardMaterial({ color: '#1b1d22', roughness: 0.62, metalness: 0.16, flatShading: true }),
  grilleBlack: new THREE.MeshStandardMaterial({ color: '#15171c', roughness: 0.50, metalness: 0.28, flatShading: true }),
  chassis:     new THREE.MeshStandardMaterial({ color: '#121418', roughness: 0.60, metalness: 0.30, flatShading: true }),
  splitterAlu: new THREE.MeshStandardMaterial({ color: '#aeb6c0', roughness: 0.32, metalness: 0.78, flatShading: true }),
  chrome:      new THREE.MeshStandardMaterial({ color: '#dde3eb', roughness: 0.14, metalness: 0.94, flatShading: true }),
  turboAlu:    new THREE.MeshStandardMaterial({ color: '#d0d7e0', roughness: 0.20, metalness: 0.90, flatShading: true }),
  impellerTi:  new THREE.MeshStandardMaterial({ color: '#9cb2cc', roughness: 0.18, metalness: 0.94, flatShading: true }),
  turboHot:    new THREE.MeshStandardMaterial({ color: '#5c493e', emissive: '#ff3b08', emissiveIntensity: 0.08, roughness: 0.45, metalness: 0.68, flatShading: true }),
  exhaustPipe: new THREE.MeshStandardMaterial({ color: '#6b707a', roughness: 0.34, metalness: 0.84, flatShading: true }),
  wastegate:   new THREE.MeshStandardMaterial({ color: '#d62020', roughness: 0.26, metalness: 0.72, flatShading: true }),
  goldRim:     new THREE.MeshStandardMaterial({ color: '#b5842a', roughness: 0.28, metalness: 0.82, flatShading: true }),
  glass:       new THREE.MeshStandardMaterial({ color: '#141921', roughness: 0.08, metalness: 0.42, transparent: true, opacity: 0.84, flatShading: true }),
  headlight:   new THREE.MeshStandardMaterial({ color: '#fff8e6', emissive: '#ffdf9e', emissiveIntensity: 1.9, roughness: 0.14 }),
  tailRed:     new THREE.MeshStandardMaterial({ color: '#ff1f1f', emissive: '#ff1616', emissiveIntensity: 2.3, roughness: 0.18 }),
  amberSide:   new THREE.MeshStandardMaterial({ color: '#ff8811', emissive: '#ff6e00', emissiveIntensity: 0.9, roughness: 0.25 }),
  rubber:      new THREE.MeshStandardMaterial({ color: '#1b1d21', roughness: 0.86, metalness: 0.04, flatShading: true }),
  sidewall:    new THREE.MeshStandardMaterial({ map: makeSidewallTex(), roughness: 0.84, metalness: 0.04 }),
  interior:    new THREE.MeshStandardMaterial({ color: '#24272f', roughness: 0.78, metalness: 0.08, flatShading: true }),
  bannerWhite: new THREE.MeshStandardMaterial({ color: '#e8edf2', roughness: 0.40, metalness: 0.05, flatShading: true }),
  flameCore:   new THREE.MeshStandardMaterial({ color: '#fff5b8', emissive: '#ffaa22', emissiveIntensity: 4.0, transparent: true, opacity: 0.0, depthWrite: false, side: THREE.DoubleSide }),
  flameOuter:  new THREE.MeshStandardMaterial({ color: '#ff5210', emissive: '#ff3600', emissiveIntensity: 3.2, transparent: true, opacity: 0.0, depthWrite: false, side: THREE.DoubleSide }),
};
for (const [k, m] of Object.entries(MATS)) m.name = 'Cuda_' + k;

// =================================================================================================
//  GEOMETRY HELPERS (Outward-Guaranteed Multi-Station Lofts & Side Panels)
// =================================================================================================
function buildLoft(rings, closed = true, capEnds = true) {
  const S = rings.length, N = rings[0].length;
  const pos = [], idx = [];
  for (let s = 0; s < S; s++) for (let i = 0; i < N; i++) { const p = rings[s][i]; pos.push(p[0], p[1], p[2]); }
  const lim = closed ? N : N - 1;
  for (let s = 0; s < S - 1; s++) {
    for (let i = 0; i < lim; i++) {
      const i1 = (i + 1) % N;
      const a = s * N + i, b = s * N + i1, c = (s + 1) * N + i1, d = (s + 1) * N + i;
      idx.push(a, b, c, a, c, d);
    }
  }
  if (capEnds && closed && N >= 3) {
    const cap = (sIdx, flip) => {
      const cIdx = pos.length / 3;
      let cx = 0, cy = 0, cz = 0;
      for (let i = 0; i < N; i++) { cx += rings[sIdx][i][0]; cy += rings[sIdx][i][1]; cz += rings[sIdx][i][2]; }
      pos.push(cx / N, cy / N, cz / N);
      for (let i = 0; i < N; i++) {
        const i1 = (i + 1) % N;
        const a = sIdx * N + i, b = sIdx * N + i1;
        if (flip) idx.push(cIdx, b, a); else idx.push(cIdx, a, b);
      }
    };
    cap(0, true); cap(S - 1, false);
  }
  if (closed && capEnds) {
    let vol = 0;
    for (let k = 0; k < idx.length; k += 3) {
      const ia = idx[k] * 3, ib = idx[k + 1] * 3, ic = idx[k + 2] * 3;
      const ax = pos[ia], ay = pos[ia + 1], az = pos[ia + 2];
      const bx = pos[ib], by = pos[ib + 1], bz = pos[ib + 2];
      const cx = pos[ic], cy = pos[ic + 1], cz = pos[ic + 2];
      vol += ax * (by * cz - bz * cy) + ay * (bz * cx - bx * cz) + az * (bx * cy - by * cx);
    }
    if (vol < 0) for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function mirrorRingsX(rings) {
  return rings.map(r => r.map(p => [-p[0], p[1], p[2]]).reverse());
}
function addMirrorLoft(parent, ringsRight, mat, nameBase, closed = true, cap = true) {
  const mR = new THREE.Mesh(buildLoft(ringsRight, closed, cap), mat); mR.name = nameBase + '_R';
  const mL = new THREE.Mesh(buildLoft(mirrorRingsX(ringsRight), closed, cap), mat); mL.name = nameBase + '_L';
  parent.add(mR, mL);
  return [mR, mL];
}

function makeSidePanel(ptsZY, xIn, xOut, mat, topTaper = 0, nameBase = 'Panel') {
  const grp = new THREE.Group(); grp.name = nameBase;
  const thick = Math.max(0.01, xOut - xIn);
  const yMin = Math.min(...ptsZY.map(p => p[1])), yMax = Math.max(...ptsZY.map(p => p[1]));
  for (const sgn of [-1, 1]) {
    const shape = new THREE.Shape();
    ptsZY.forEach((p, i) => i === 0 ? shape.moveTo(p[0], p[1]) : shape.lineTo(p[0], p[1]));
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.010, bevelSegments: 1 });
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const sz = p.getX(i), sy = p.getY(i), sx = p.getZ(i);
      const tH = THREE.MathUtils.clamp((sy - yMin) / Math.max(0.01, yMax - yMin), 0, 1);
      const xBase = xIn + sx - topTaper * tH * (sx / Math.max(0.01, thick));
      p.setXYZ(i, sgn * xBase, sy, sz);
    }
    if (sgn > 0) {
      const idx = geo.index;
      if (idx) for (let i = 0; i < idx.count; i += 3) { const b = idx.getX(i + 1), c = idx.getX(i + 2); idx.setX(i + 1, c); idx.setX(i + 2, b); }
      else for (let i = 0; i < p.count; i += 3) {
        const x1 = p.getX(i + 1), y1 = p.getY(i + 1), z1 = p.getZ(i + 1);
        p.setXYZ(i + 1, p.getX(i + 2), p.getY(i + 2), p.getZ(i + 2));
        p.setXYZ(i + 2, x1, y1, z1);
      }
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.name = nameBase + (sgn > 0 ? '_R' : '_L');
    grp.add(mesh);
  }
  return grp;
}

function makeTube(a, b, r = 0.02, mat = MATS.exhaustPipe, segs = 10) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, Math.max(0.004, dir.length()), segs), mat);
  m.position.addVectors(va, vb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

// REAL SCULPTED OUTER SIDE BODY FLANKS WITH GENUINE OPEN FRONT & REAR WHEEL-ARCH CUTOUTS!
// Traces the exact 1971 'Cuda coke-bottle side profile in (Z, Y) and carves circular wheel arches!
function buildCudaSideFlanks() {
  const grp = new THREE.Group(); grp.name = 'Cuda_SideFlanks';
  const rArchF = 0.415, rArchR = 0.435;
  const shape = new THREE.Shape();
  // Start at bottom rear tail corner -> sweep forward around REAR wheel arch -> flat door sill -> FRONT wheel arch -> nose -> beltline -> rear hip!
  shape.moveTo(-2.24, 0.46);
  shape.lineTo(-1.98, 0.34);
  shape.lineTo(Z_REAR - rArchR, 0.26);
  // Real open semicircular REAR wheel-well cutout (counter-clockwise over top of tire!)
  for (let i = 0; i <= 14; i++) {
    const a = Math.PI - (i / 14) * Math.PI;
    shape.lineTo(Z_REAR + Math.cos(a) * rArchR, R_TIRE + Math.sin(a) * rArchR);
  }
  shape.lineTo(Z_REAR + rArchR, 0.16);
  shape.lineTo(Z_FRONT - rArchF, 0.16);
  // Real open semicircular FRONT wheel-well cutout!
  for (let i = 0; i <= 14; i++) {
    const a = Math.PI - (i / 14) * Math.PI;
    shape.lineTo(Z_FRONT + Math.cos(a) * rArchF, R_TIRE + Math.sin(a) * rArchF);
  }
  shape.lineTo(Z_FRONT + rArchF, 0.24);
  shape.lineTo(2.24, 0.32);
  shape.lineTo(2.26, 0.79);   // crisp angular front nose corner
  shape.lineTo(1.94, 0.87);   // front fender upper crease
  shape.lineTo(1.38, 0.91);   // crisp straight front fender shoulder
  shape.lineTo(0.72, 0.89);   // cowl corner
  shape.lineTo(-0.32, 0.89);  // straight door beltline
  shape.lineTo(-0.84, 0.95);  // iconic '71 'Cuda rising coke-bottle rear hip!
  shape.lineTo(-1.55, 0.955); // muscular flat rear quarter crown
  shape.lineTo(-2.22, 0.91);  // crisp rear tail corner
  shape.closePath();

  const xIn = 0.64, thick = 0.285;
  for (const sgn of [-1, 1]) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: true, bevelThickness: 0.022, bevelSize: 0.018, bevelSegments: 1 });
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const sz = p.getX(i), sy = p.getY(i), sx = p.getZ(i);
      const fracOut = THREE.MathUtils.clamp(sx / thick, 0, 1);
      // Subtle sculpted coke-bottle waist tuck in the door + muscular haunch flare over wheels + upper shoulder bevel!
      const waistTuck = -0.028 * Math.exp(-Math.pow((sz + 0.05) / 0.55, 2));
      const rearHaunch = 0.032 * Math.exp(-Math.pow((sz + 1.25) / 0.58, 2));
      const noseTaper = sz > 1.85 ? -0.035 * ((sz - 1.85) / 0.42) : 0;
      const tailTaper = sz < -1.85 ? -0.042 * ((-1.85 - sz) / 0.42) : 0;
      const upperTumble = sy > 0.72 ? -0.026 * ((sy - 0.72) / 0.24) : 0;
      const lowerPinch  = sy < 0.36 ? -0.040 * ((0.36 - sy) / 0.22) : 0;
      const xFinal = xIn + sx + fracOut * (waistTuck + rearHaunch + noseTaper + tailTaper + upperTumble + lowerPinch);
      p.setXYZ(i, sgn * xFinal, sy, sz);
    }
    if (sgn > 0) {
      const idx = geo.index;
      if (idx) for (let i = 0; i < idx.count; i += 3) { const b = idx.getX(i + 1), c = idx.getX(i + 2); idx.setX(i + 1, c); idx.setX(i + 2, b); }
      else for (let i = 0; i < p.count; i += 3) {
        const x1 = p.getX(i + 1), y1 = p.getY(i + 1), z1 = p.getZ(i + 1);
        p.setXYZ(i + 1, p.getX(i + 2), p.getY(i + 2), p.getZ(i + 2));
        p.setXYZ(i + 2, x1, y1, z1);
      }
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, MATS.body);
    mesh.name = 'Cuda_SideFlank_' + (sgn > 0 ? 'R' : 'L');
    grp.add(mesh);
  }
  return grp;
}

function buildWidebodyFlare(zCenter, rArch, wOut, nameBase) {
  const N = 14;
  const rings = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ang = THREE.MathUtils.lerp(-0.10, Math.PI + 0.10, t);
    const zIn  = zCenter + Math.cos(ang) * rArch;
    const zOut = zCenter + Math.cos(ang) * (rArch + 0.085);
    const yIn  = Math.max(0.16, R_TIRE + Math.sin(ang) * rArch);
    const yOut = Math.max(0.18, R_TIRE + Math.sin(ang) * (rArch + 0.088));
    const xBody = 0.895;
    const bulge = 0.04 + Math.sin(Math.PI * t) * wOut;
    // Chamfered 6-point widebody overfender cross-section with crisp inner return lip into the wheel well!
    rings.push([
      [xBody - 0.03, yIn, zIn],
      [xBody + bulge, yIn + 0.008, zIn],
      [xBody + bulge * 1.04, yIn + 0.032, zIn + Math.cos(ang) * 0.015],
      [xBody + bulge * 0.78, yOut - 0.006, zOut],
      [xBody - 0.005, yOut + 0.004, zOut],
    ]);
  }
  addMirrorLoft(trimGroup, rings, MATS.flareBlack, nameBase);
  for (const s of [-1, 1]) {
    for (let b = 2; b <= N - 2; b += 2) {
      const t = b / N, ang = THREE.MathUtils.lerp(-0.10, Math.PI + 0.10, t);
      const z = zCenter + Math.cos(ang) * (rArch + 0.056);
      const y = Math.max(0.20, R_TIRE + Math.sin(ang) * (rArch + 0.056));
      const bulge = 0.04 + Math.sin(Math.PI * t) * wOut;
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.0085, 0.0085, 0.018, 6), MATS.chrome);
      bolt.rotation.z = Math.PI / 2;
      bolt.position.set(s * (0.895 + bulge * 0.82), y, z);
      trimGroup.add(bolt);
    }
  }
}

// Helper: Builds a CHISELED FACETED LOGARITHMIC SPIRAL TURBO VOLUTE (Trapezoidal/Octagonal Snail Scroll!)
function buildFacetedScroll(side, r0, r1, w0, w1, zOff, mat, name) {
  const N_ST = 12;
  const rings = [];
  for (let i = 0; i <= N_ST; i++) {
    const t = i / N_ST;
    // Sweep 305 degrees around the hub so the spiral expands naturally into a crisp tangential outlet horn!
    const a = side * (0.25 + t * Math.PI * 1.72);
    const r = THREE.MathUtils.lerp(r0, r1, t);
    const hw = THREE.MathUtils.lerp(w0, w1, Math.pow(t, 0.85)); // radial half-height
    const hz = hw * 0.92;                                        // axial half-depth
    const cx = Math.cos(a) * r, cy = Math.sin(a) * r;
    const rx = Math.cos(a), ry = Math.sin(a);
    // 6-vertex crisp chamfered trapezoidal/hexagonal cross-section (unmistakable chiseled motorsport housing!)
    const prof = [
      [-hw * 0.78, -hz * 0.65],
      [ hw * 0.92, -hz * 0.55],
      [ hw * 1.04,  0.0],
      [ hw * 0.92,  hz * 0.55],
      [-hw * 0.78,  hz * 0.65],
      [-hw * 0.92,  0.0],
    ];
    rings.push(prof.map(([dr, dz]) => [cx + rx * dr, cy + ry * dr, zOff + dz]));
  }
  // Extend final tangential trapezoidal discharge nozzle!
  const lastA = side * (0.25 + Math.PI * 1.72);
  const tx = -Math.sin(lastA) * side, ty = Math.cos(lastA) * side;
  const rx = Math.cos(lastA), ry = Math.sin(lastA);
  const cx = Math.cos(lastA) * r1 + tx * 0.11, cy = Math.sin(lastA) * r1 + ty * 0.11;
  const hw = w1 * 0.96, hz = w1 * 0.88;
  rings.push([
    [-hw * 0.78, -hz * 0.65], [hw * 0.92, -hz * 0.55], [hw * 1.04, 0.0],
    [hw * 0.92, hz * 0.55], [-hw * 0.78, hz * 0.65], [-hw * 0.92, 0.0],
  ].map(([dr, dz]) => [cx + rx * dr, cy + ry * dr, zOff + dz]));
  const m = new THREE.Mesh(buildLoft(rings, true, true), mat);
  m.name = name;
  return m;
}

// 7. DEEP-DISH BRONZE/GOLD 5-SPOKE RETRO RACING WHEELS & CHUNKY WIDE MUSCLE SLICKS (Image 2!)
// -------------------------------------------------------------------------------------------------
function buildMuscleWheel(isLeft, width) {
  const wheel = new THREE.Group();
  const s = isLeft ? -1 : 1;
  const hw = width * 0.5;
  const rIn = 0.215, rMid = 0.295, rOut = R_TIRE;

  // Fat curved racing slick tire carcass (LatheGeometry)
  const prof = [
    [rIn, -hw * 0.86], [rMid, -hw * 1.02], [rOut - 0.022, -hw * 0.92],
    [rOut, -hw * 0.78], [rOut, hw * 0.78], [rOut - 0.022, hw * 0.92],
    [rMid, hw * 1.02], [rIn, hw * 0.86], [rIn, -hw * 0.86],
  ].map(([r, x]) => new THREE.Vector2(r, x));
  const tireGeo = new THREE.LatheGeometry(prof, 28);
  tireGeo.rotateZ(-Math.PI / 2);
  const tireMesh = new THREE.Mesh(tireGeo, MATS.rubber);
  tireMesh.name = 'Tire_Slick';
  wheel.add(tireMesh);

  // Subtle Goodyear Trans-Am sidewall ring
  const swRing = new THREE.RingGeometry(rIn * 1.02, rOut * 0.94, 28);
  const swOut = new THREE.Mesh(swRing, MATS.sidewall);
  swOut.rotation.y = s > 0 ? Math.PI / 2 : -Math.PI / 2;
  swOut.position.x = s * (hw * 0.98);
  swOut.name = 'Tire_Sidewall';
  wheel.add(swOut);

  // Deep-Dish Bronze/Gold 5-Spoke Retro-Racing Rim (exact Image 2 gold deep-dish aesthetic!)
  const rim = new THREE.Group(); rim.name = 'Rim_DeepDishGold';
  const rRim = 0.224;
  // Stepped deep-dish outer gold barrel lip!
  const outerLip = new THREE.Mesh(new THREE.TorusGeometry(rRim - 0.008, 0.016, 10, 28), MATS.goldRim);
  outerLip.rotation.y = Math.PI / 2; outerLip.position.x = s * hw * 0.82;
  rim.add(outerLip);
  const stepBarrel = new THREE.Mesh(new THREE.CylinderGeometry(rRim - 0.010, rRim - 0.022, hw * 0.72, 24, 1, true), MATS.goldRim);
  stepBarrel.rotation.z = Math.PI / 2; stepBarrel.position.x = s * hw * 0.44;
  rim.add(stepBarrel);
  const innerDrum = new THREE.Mesh(new THREE.CylinderGeometry(rRim - 0.024, rRim - 0.024, hw * 1.35, 22), MATS.chassis);
  innerDrum.rotation.z = Math.PI / 2; innerDrum.position.x = -s * hw * 0.10;
  rim.add(innerDrum);

  // Recessed dished 5-spoke star face + machined silver center-lock knock-off hub!
  const hubX = s * hw * 0.14;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.064, 0.075, 14), MATS.goldRim);
  hub.rotation.z = Math.PI / 2; hub.position.x = hubX;
  const centerLock = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 0.10, 6), MATS.chrome);
  centerLock.rotation.z = Math.PI / 2; centerLock.position.x = hubX + s * 0.035;
  rim.add(hub, centerLock);

  const spGeo = new THREE.BoxGeometry(0.030, rRim - 0.055, 0.038);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const sp = new THREE.Mesh(spGeo, MATS.goldRim);
    sp.position.set(hubX + s * 0.012, Math.cos(a) * (rRim * 0.48), Math.sin(a) * (rRim * 0.48));
    sp.rotation.x = a;
    rim.add(sp);
  }
  // Brake rotor & red caliper tucked cleanly behind the 5 spokes!
  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(rRim * 0.74, rRim * 0.74, 0.022, 18), MATS.splitterAlu);
  rotor.rotation.z = Math.PI / 2; rotor.position.x = -s * hw * 0.16;
  const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.11, 0.075), MATS.wastegate);
  caliper.position.set(-s * hw * 0.14, 0.03, -0.11);
  rim.add(rotor, caliper);

  wheel.add(rim);
  return wheel;
}

// Clean Blender-ready GLB + named-parts OBJ/MTL exporter
const toast = msg => { const el = document.getElementById('toast'); el.textContent = msg; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 2400); };
const dl = (name, blob) => {
  const url = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click();

function serializeOBJandMTL(root, mtlFilename) {
  root.updateMatrixWorld(true);
  const lines = [`# 1971 Widebody Cuda Twin-Turbo — Game Asset (metres, Y-up, +Z forward)`, `mtllib ${mtlFilename}`];
  const usedMats = new Map();
  let vOff = 1, vtOff = 1, vnOff = 1, meshIdx = 0;
  const v = new THREE.Vector3(), n = new THREE.Vector3(), nMat = new THREE.Matrix3();

  root.traverseVisible(obj => {
    if (!obj.isMesh || !obj.geometry) return;
    const g = obj.geometry, pos = g.attributes.position; if (!pos) return;
    const uv = g.attributes.uv, norm = g.attributes.normal;
    const mat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
    const matName = (mat && mat.name) ? mat.name : 'default';
    if (mat) usedMats.set(matName, mat);
    const parentName = obj.parent?.name ? obj.parent.name + '_' : '';
    const objName = (obj.name || `${parentName}Mesh_${String(++meshIdx).padStart(3, '0')}`).replace(/\s+/g, '_');
    lines.push(`o ${objName}`, `usemtl ${matName}`);
    const m = obj.matrixWorld; nMat.getNormalMatrix(m); const det = m.determinant();
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m); lines.push(`v ${v.x.toFixed(5)} ${v.y.toFixed(5)} ${v.z.toFixed(5)}`); }
    if (uv) for (let i = 0; i < uv.count; i++) lines.push(`vt ${uv.getX(i).toFixed(4)} ${uv.getY(i).toFixed(4)}`);
    if (norm) for (let i = 0; i < norm.count; i++) { n.fromBufferAttribute(norm, i).applyMatrix3(nMat).normalize(); lines.push(`vn ${n.x.toFixed(4)} ${n.y.toFixed(4)} ${n.z.toFixed(4)}`); }
    const fmt = idx => { const vi = idx + vOff; return uv && norm ? `${vi}/${idx + vtOff}/${idx + vnOff}` : norm ? `${vi}//${idx + vnOff}` : uv ? `${vi}/${idx + vtOff}` : `${vi}`; };
    const index = g.index, count = index ? index.count : pos.count;
    for (let i = 0; i < count; i += 3) {
      const a = index ? index.getX(i) : i, b = index ? index.getX(i + 1) : i + 1, c = index ? index.getX(i + 2) : i + 2;
      lines.push(det < 0 ? `f ${fmt(a)} ${fmt(c)} ${fmt(b)}` : `f ${fmt(a)} ${fmt(b)} ${fmt(c)}`);
    }
    vOff += pos.count; if (uv) vtOff += uv.count; if (norm) vnOff += norm.count;
  });

  const mtl = [`# Material Library for 1971 Widebody Cuda Twin-Turbo`];
  for (const [name, mat] of usedMats.entries()) {
    const c = mat.color || new THREE.Color(0.8, 0.8, 0.8);
    const e = mat.emissive && mat.emissiveIntensity > 0 ? mat.emissive : null;
    mtl.push(`newmtl ${name}`, `Kd ${c.r.toFixed(4)} ${c.g.toFixed(4)} ${c.b.toFixed(4)}`,
      `Ks ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)}`,
      `Ns ${Math.round((1 - (mat.roughness ?? 0.5)) * 200 + 10)}`);
    if (e) mtl.push(`Ke ${(e.r * mat.emissiveIntensity).toFixed(3)} ${(e.g * mat.emissiveIntensity).toFixed(3)} ${(e.b * mat.emissiveIntensity).toFixed(3)}`);
    mtl.push(`d ${mat.transparent ? mat.opacity.toFixed(2) : '1.0'}`, ``);
  }
  return { obj: lines.join('\n') + '\n', mtl: mtl.join('\n') };
}

document.getElementById('expGlb').onclick = () => {

// =================================================================================================
//  ANIMATION LOOP (LIVE SPOOLING TWIN-TURBOS, THERMAL HOT-SIDE GLOW, V8 ROCK & ANTI-LAG FLAMES!)
// =================================================================================================
const boostFillEl = document.getElementById('boostFill');
const boostPsiEl  = document.getElementById('boostPsi');
let prevT = performance.now(), elapsed = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now; elapsed += dt;

  // Smooth camera transition & damped wheel zoom
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 3.2);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  if (zoomTargetDist !== null) {
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length();
    const next = cur + (zoomTargetDist - cur) * (1 - Math.exp(-14 * dt));
    if (Math.abs(next - zoomTargetDist) < 0.002) { off.setLength(zoomTargetDist); zoomTargetDist = null; }
    else off.setLength(next);
    camera.position.copy(controls.target).add(off);
  }

  // Animated Twin-Turbo Spool Physics!
  let desired = RIG.targetBoost;
  let flameBurst = 0;
  if (RIG.revTimer > 0) {
    RIG.revTimer = Math.max(0, RIG.revTimer - dt);
    if (RIG.revTimer > 0.55) desired = 1.0; // full-throttle spool-up!
    else { desired = Math.max(RIG.targetBoost, RIG.revTimer * 1.3); flameBurst = 1.0; } // anti-lag decel crackle pops!
  }
  const spoolRate = desired > RIG.currentBoost ? 4.2 : 2.1; // realistic turbo spool-up & blow-off spool-down!
  RIG.currentBoost += (desired - RIG.currentBoost) * (1 - Math.exp(-spoolRate * dt));
  const b = RIG.currentBoost;

  // 1) Spin both 10-blade billet compressor impellers smoothly from idle (5 rad/s) up to screaming boost (58 rad/s)!
  if (RIG.turboSpin) {
    const omega = 4.5 + Math.pow(b, 1.35) * 54.0;
    for (const imp of animatedImpellers) imp.group.rotation.z += imp.dir * omega * dt;
  }

  // 2) Hot-side exhaust turbine housings glow dynamic cherry-red / orange under sustained boost!
  MATS.turboHot.emissiveIntensity = 0.05 + Math.pow(b, 1.8) * 2.15;

  // 3) Subtle muscular V8 engine torque-rock & high-frequency vibration!
  const vibAmp = 0.0012 + b * 0.0038;
  engineShakeGroup.rotation.z = Math.sin(elapsed * (28 + b * 36)) * (0.004 + b * 0.012) + b * 0.014;
  engineShakeGroup.position.y = Math.sin(elapsed * (46 + b * 42)) * vibAmp;

  // 4) Animated anti-lag dump-pipe exhaust flames at high boost (>78%) or during Rev Burst decel!
  const showFlames = RIG.flamesOn && (b > 0.78 || flameBurst > 0.1);
  const flicker = 0.55 + 0.45 * Math.sin(elapsed * 78) * Math.cos(elapsed * 43);
  const fIntensity = showFlames ? Math.max((b - 0.75) * 4.0, flameBurst) * flicker : 0;
  MATS.flameOuter.opacity = THREE.MathUtils.clamp(fIntensity * 0.85, 0, 0.92);
  MATS.flameCore.opacity  = THREE.MathUtils.clamp(fIntensity * 0.95, 0, 1.0);
  for (let i = 0; i < antiLagFlames.length; i++) {
    const fl = antiLagFlames[i];
    fl.visible = fIntensity > 0.08;
    if (fl.visible) {
      const sY = 0.6 + fIntensity * (0.85 + 0.35 * Math.sin(elapsed * 95 + i * 2.1));
      fl.scale.set(0.85 + fIntensity * 0.3, sY, 0.85 + fIntensity * 0.3);
    }
  }

  // Update live boost HUD telemetry bar
  const psi = (b * 28.5).toFixed(1);
  const rpmK = Math.round(14 + b * 126);
  boostFillEl.style.width = `${Math.max(4, Math.round(b * 100))}%`;
  boostPsiEl.textContent = `${psi} PSI · ${rpmK}k RPM`;

  if (RIG.drive) {
    const spinStep = dt * (4.5 + b * 6.5);
    for (const w of Object.values(wheelPivots)) w.spin.rotation.x += spinStep;
  }
  if (RIG.turntable) CAR.rotation.y += dt * 0.35;

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
