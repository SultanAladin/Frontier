<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baja Trophy Truck — Low-Poly 3D Game Asset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');
  :root{--bg:#101114;--card:rgba(20,21,26,.86);--card2:rgba(34,36,44,.9);--ink:#eef0f5;--mut:#9aa0ae;--line:rgba(255,255,255,.1);--red:#e53935;--accent:#ff5252;--green:#38c46d;--yellow:#e2c643}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#8d0c08;color:var(--ink);font:400 13px/1.4 'Outfit',system-ui,sans-serif}
  #canvasWrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* Top-left title badge */
  #badge{position:fixed;top:16px;left:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(12px);pointer-events:none;z-index:10;min-width:210px}
  #badge .eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
  #badge .title{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-top:1px}
  #badge .sub{font-size:11.5px;color:var(--mut);margin-top:2px;font-family:ui-monospace,Menlo,monospace}

  /* Bottom-left stats HUD */
  #stats{position:fixed;left:18px;bottom:16px;display:flex;gap:8px;z-index:10;pointer-events:none;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;backdrop-filter:blur(12px)}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
  .stat .v{font-size:14px;font-weight:500;font-family:ui-monospace,Menlo,monospace;color:#fff}
  .stat .v small{font-size:10.5px;color:var(--mut);font-weight:400;margin-left:3px}

  /* Bottom-center camera view bar */
  #views{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;backdrop-filter:blur(12px);z-index:10}
  #views button{border:0;background:transparent;color:var(--mut);padding:6px 13px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  #views button:hover{color:#fff;background:rgba(255,255,255,.08)}
  #views button.on{background:#fff;color:#111;font-weight:500}

  /* Right collapsible control panel */
  #panel{position:fixed;top:16px;right:18px;width:274px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;backdrop-filter:blur(14px);z-index:10;display:flex;flex-direction:column;gap:12px}
  #panel::-webkit-scrollbar{width:5px} #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}
  .sec{display:flex;flex-direction:column;gap:7px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0;padding-bottom:0}
  .sec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
  .row label{color:#d2d6e0}
  .row .val{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);min-width:44px;text-align:right}
  input[type=range]{flex:1;accent-color:#fff;cursor:pointer;height:4px}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatch{width:24px;height:24px;border-radius:999px;border:2px solid rgba(255,255,255,.22);cursor:pointer;transition:transform .12s,border-color .12s}
  .swatch:hover{transform:scale(1.1)}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:9px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;transition:all .14s}
  .pill:hover{color:#fff;background:rgba(255,255,255,.1)}
  .pill.on{background:#fff;color:#111;border-color:#fff;font-weight:500}
  .btns{display:flex;gap:6px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.primary{background:#fff;color:#111;border-color:#fff}
  .btn.primary:hover{background:#e6e8ed}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:#111;padding:7px 16px;border-radius:999px;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  @media(max-width:780px){#panel{width:228px;font-size:11.5px}#views{bottom:64px}}
</style>
</head>
<body>
<div id="canvasWrap"></div>

<div id="badge">
  <div class="eyebrow">Low-Poly Game Asset</div>
  <div class="title">Baja Trophy Truck</div>

<div id="panel">
  <div class="sec">

    <h3>Export for Game Engine</h3>
    <div class="btns">
      <button class="btn primary" id="expGlb">Export GLB</button>
      <button class="btn" id="expObj">Export OBJ</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// =================================================================================================
//  SCENE, CAMERA, STUDIO RED CYCLORAMA & SMOOTH ZOOM
// =================================================================================================
const wrap = document.getElementById('canvasWrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.08, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false; // replaced with smooth damped zoom below
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2.1;
controls.maxDistance = 16.0;

let zoomTargetDist = null;
function normalizeWheelDelta(e) {
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;
  else if (e.deltaMode === 2) d *= 400;
  return THREE.MathUtils.clamp(d, -120, 120);
}
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault(); e.stopImmediatePropagation();
  const dy = normalizeWheelDelta(e);
  if (!dy) return;
  const cur = zoomTargetDist ?? camera.position.distanceTo(controls.target);
  zoomTargetDist = THREE.MathUtils.clamp(cur * Math.exp(dy * 0.0012), controls.minDistance, controls.maxDistance);
}, { passive: false, capture: true });
controls.addEventListener('start', () => { zoomTargetDist = null; });

// Studio lighting — crisp overhead softbox + rim kicks matching the red studio reference shots
const hemi = new THREE.HemisphereLight('#fff5f0', '#6d120c', 0.65);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight('#fffbf5', 2.4);
keyLight.position.set(5.5, 9.5, 5.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 22;
keyLight.shadow.camera.left = -4.2; keyLight.shadow.camera.right = 4.2;
keyLight.shadow.camera.top = 4.2; keyLight.shadow.camera.bottom = -4.2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight('#ffd8cc', 0.85);
fillLight.position.set(-6.0, 4.5, -3.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#ffffff', 0.95);
rimLight.position.set(-2.0, 5.0, -7.5);
scene.add(rimLight);

// Studio floor & cyclorama backdrop
const floorGeo = new THREE.CircleGeometry(28, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: '#b5180d', roughness: 0.24, metalness: 0.08 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Subtle curved studio gradient dome
const domeGeo = new THREE.SphereGeometry(28, 32, 20);
const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uTop: { value: new THREE.Color('#420402') },
    uMid: { value: new THREE.Color('#a31008') },
    uBot: { value: new THREE.Color('#c81d0f') },
  },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop,uMid,uBot; varying vec3 vPos;
    void main(){
      float h = clamp(normalize(vPos).y, -0.2, 1.0);
      vec3 c = h < 0.22 ? mix(uBot, uMid, smoothstep(-0.08, 0.22, h)) : mix(uMid, uTop, smoothstep(0.22, 0.85, h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const dome = new THREE.Mesh(domeGeo, domeMat);
scene.add(dome);

const gridHelper = new THREE.GridHelper(16, 32, '#444854', '#262933');
gridHelper.position.y = 0.002;
gridHelper.visible = false;
scene.add(gridHelper);

// =================================================================================================
//  PROCEDURAL TEXTURES & MATERIALS (SUBTLE DIAGONAL CARBON/STRIPE GHOST LIVERY + GAME MATERIALS)
// =================================================================================================
function makeBodyTexture(hexColor) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor; ctx.fillRect(0, 0, 512, 512);
  // Subtle diagonal micro-stripe livery matching the matte white trophy truck doors/fins
  ctx.strokeStyle = 'rgba(0,0,0,0.038)'; ctx.lineWidth = 7;
  for (let i = -512; i < 1024; i += 20) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 512, 512); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}

const MATS = {
  body:      new THREE.MeshStandardMaterial({ color: '#ffffff', map: makeBodyTexture('#f1f2f4'), roughness: 0.34, metalness: 0.06, flatShading: true }),
  bodyDark:  new THREE.MeshStandardMaterial({ color: '#1b1c20', roughness: 0.62, metalness: 0.15, flatShading: true }),
  chassis:   new THREE.MeshStandardMaterial({ color: '#141518', roughness: 0.55, metalness: 0.35, flatShading: true }),
  cage:      new THREE.MeshStandardMaterial({ color: '#181a1f', roughness: 0.42, metalness: 0.52, flatShading: true }),
  steel:     new THREE.MeshStandardMaterial({ color: '#c8cdd4', roughness: 0.28, metalness: 0.88, flatShading: true }),
  chrome:    new THREE.MeshStandardMaterial({ color: '#e4e8ee', roughness: 0.14, metalness: 0.95, flatShading: true }),
  shockRed:  new THREE.MeshStandardMaterial({ color: '#d42c24', roughness: 0.35, metalness: 0.55, flatShading: true }),
  shockBlue: new THREE.MeshStandardMaterial({ color: '#2566b8', roughness: 0.35, metalness: 0.55, flatShading: true }),
  rubber:    new THREE.MeshStandardMaterial({ color: '#1b1c1f', roughness: 0.86, metalness: 0.04, flatShading: true }),
  rimWhite:  new THREE.MeshStandardMaterial({ color: '#eff1f4', roughness: 0.26, metalness: 0.14, flatShading: true }),
  rimLip:    new THREE.MeshStandardMaterial({ color: '#191b1f', roughness: 0.45, metalness: 0.4, flatShading: true }),
  seat:      new THREE.MeshStandardMaterial({ color: '#202226', roughness: 0.85, metalness: 0.02, flatShading: true }),
  ledWhite:  new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#e8f4ff', emissiveIntensity: 2.2, roughness: 0.2 }),
  ledRed:    new THREE.MeshStandardMaterial({ color: '#ff2b2b', emissive: '#ff1e1e', emissiveIntensity: 2.4, roughness: 0.25 }),
};

// =================================================================================================
//  LOW-POLY HARD-SURFACE GEOMETRY HELPERS
// =================================================================================================
// Create a closed lofted mesh from an array of cross-section rings (each ring = [[x,y,z], ...], same count)
// Automatically guarantees outward-facing normals via signed volume for closed lofts (or explicit flip for open lofts)
function buildLoft(rings, closeLoop = false, capEnds = true, flipOpen = false) {
  const nR = rings.length, nP = rings[0].length;
  const pos = [];
  const idx = [];
  for (let i = 0; i < nR; i++) {
    for (let j = 0; j < nP; j++) pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
  }
  const jMax = closeLoop ? nP : nP - 1;
  for (let i = 0; i < nR - 1; i++) {
    for (let j = 0; j < jMax; j++) {
      const jn = (j + 1) % nP;
      const a = i * nP + j, b = i * nP + jn, c = (i + 1) * nP + jn, d = (i + 1) * nP + j;
      idx.push(a, b, c, a, c, d);
    }
  }
  if (capEnds && closeLoop) {
    for (const end of [0, nR - 1]) {
      let cx = 0, cy = 0, cz = 0;
      for (let j = 0; j < nP; j++) { cx += rings[end][j][0]; cy += rings[end][j][1]; cz += rings[end][j][2]; }
      const cIdx = pos.length / 3;
      pos.push(cx / nP, cy / nP, cz / nP);
      for (let j = 0; j < nP; j++) {
        const a = end * nP + j, b = end * nP + (j + 1) % nP;
        if (end === 0) idx.push(cIdx, b, a);
        else idx.push(cIdx, a, b);
      }
    }
  }
  // Check signed volume for closed meshes and auto-flip winding if inverted
  let shouldFlip = flipOpen;
  if (closeLoop && capEnds) {
    let vol6 = 0;
    for (let t = 0; t < idx.length; t += 3) {
      const ia = idx[t] * 3, ib = idx[t + 1] * 3, ic = idx[t + 2] * 3;
      const ax = pos[ia], ay = pos[ia + 1], az = pos[ia + 2];
      const bx = pos[ib], by = pos[ib + 1], bz = pos[ib + 2];
      const cx = pos[ic], cy = pos[ic + 1], cz = pos[ic + 2];
      vol6 += ax * (by * cz - bz * cy) + ay * (bz * cx - bx * cz) + az * (bx * cy - by * cx);
    }
    if (vol6 < 0) shouldFlip = true;
  }
  if (shouldFlip) {
    for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const uvs = new Float32Array((pos.length / 3) * 2);
  for (let i = 0; i < pos.length / 3; i++) {
    uvs[i * 2] = pos[i * 3 + 2] * 0.35 + pos[i * 3] * 0.2;
    uvs[i * 2 + 1] = pos[i * 3 + 1] * 0.35;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  return g;
}

// Create a crisp mirrored pair of 2D side-profile extruded panels (pts in [z, y], extruded outward along X from xIn to xOut)
function makeSidePanel(ptsZY, xIn, xOut, mat, topFlareIn = 0) {
  // Build a custom closed solid prism with optional top inward taper (tumblehome / fender flare!)
  const grp = new THREE.Group();
  const yMin = Math.min(...ptsZY.map(p => p[1]));
  const yMax = Math.max(...ptsZY.map(p => p[1]));
  const shape = new THREE.Shape();
  ptsZY.forEach(([z, y], i) => i ? shape.lineTo(z, y) : shape.moveTo(z, y));
  shape.closePath();

  const buildOne = sgn => {
    // Extrude in +Z of shape space, then remap (shapeX->z, shapeY->y, shapeZ->x)
    const thick = Math.abs(xOut - xIn);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.012, bevelSegments: 1 });
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const sz = p.getX(i), sy = p.getY(i), sx = p.getZ(i);
      const tH = THREE.MathUtils.clamp((sy - yMin) / Math.max(0.01, yMax - yMin), 0, 1);
      // Taper outer top edge inward/outward cleanly
      const xBase = xIn + sx - topFlareIn * tH * (sx / Math.max(0.01, thick));
      p.setXYZ(i, sgn * xBase, sy, sz);
    }
    // Fix triangle winding after axis permutation + left/right mirror
    const index = geo.index;
    const flip = sgn > 0; // (sz, sy, sx) -> (x, y, z) swaps X & Z (det = -1); mirroring by -1 flips again!
    if (flip) {
      if (index) {
        for (let i = 0; i < index.count; i += 3) { const b = index.getX(i + 1), c = index.getX(i + 2); index.setX(i + 1, c); index.setX(i + 2, b); }
      } else {
        for (let i = 0; i < p.count; i += 3) {
          const x1 = p.getX(i + 1), y1 = p.getY(i + 1), z1 = p.getZ(i + 1);
          p.setXYZ(i + 1, p.getX(i + 2), p.getY(i + 2), p.getZ(i + 2));
          p.setXYZ(i + 2, x1, y1, z1);
        }
      }
    }
    // Clean side-projected UVs
    const uv = geo.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getZ(i) * 0.35, p.getY(i) * 0.35);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  };
  grp.add(buildOne(1), buildOne(-1));
  return grp;
}

// Tubular bar between two 3D points (perfect for roll cage, prerunner bumpers, trailing arms & shocks)
function makeTube(a, b, r = 0.024, mat = MATS.cage, segs = 8) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, segs), mat);
  m.position.addVectors(va, vb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}
function addMirrorTube(parent, a, b, r = 0.024, mat = MATS.cage, segs = 8) {
  parent.add(makeTube(a, b, r, mat, segs));
  if (Math.abs(a[0]) > 1e-4 || Math.abs(b[0]) > 1e-4) {
    parent.add(makeTube([-a[0], a[1], a[2]], [-b[0], b[1], b[2]], r, mat, segs));
  }
}

// =================================================================================================
//  BUILD THE BAJA TROPHY TRUCK (CLEAN HIERARCHY FOR GAME ENGINE EXPORT)
// =================================================================================================
const TRUCK = new THREE.Group();
TRUCK.name = 'BajaTrophyTruck';
scene.add(TRUCK);

// Dimensions (metres) — matched directly to the 3 reference photos
const R_TIRE = 0.51;          // 1.02 m outer diameter (~40" Baja mud-terrain)
const W_TIRE = 0.36;          // 14.2" wide off-road tire
const Z_FRONT = 1.60;         // Front axle Z
const Z_REAR  = -1.60;        // Rear axle Z (3.20 m wheelbase)
const X_TRACK = 0.99;         // Wheel center X (±0.99 m -> 2.34 m outer width)

// Root sub-groups (cleanly separated so game engines can rig suspension & wheels!)
const bodyGroup = new THREE.Group(); bodyGroup.name = 'Body';
const cageGroup = new THREE.Group(); cageGroup.name = 'RollCageAndChassis';

// Helper for dynamic strut / control-arm cylinder that updates between world/truck points pA -> pB
function makeDynamicLink(r, mat, segs = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, segs), mat);
  suspGroup.add(m);
  return m;
}
function orientLink(mesh, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = Math.max(0.01, dir.length());
  mesh.position.addVectors(a, b).multiplyScalar(0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
}

// Front upper/lower A-arms & coilover shocks
for (const s of [-1, 1]) {
  const upperF = makeDynamicLink(0.022, MATS.cage, 6);
  const upperR = makeDynamicLink(0.022, MATS.cage, 6);
  const lowerF = makeDynamicLink(0.028, MATS.chassis, 6);
  const lowerR = makeDynamicLink(0.028, MATS.chassis, 6);
  const shockBody = makeDynamicLink(0.042, MATS.steel, 8);
  const shockSpring = makeDynamicLink(0.054, MATS.shockRed, 8);
  suspRefs.frontLinks.push({ s, upperF, upperR, lowerF, lowerR, shockBody, shockSpring });

  // Heavy-duty long rear trailing arms + twin bypass shocks (classic Trophy Truck look!)
  const trailArm = makeDynamicLink(0.044, MATS.chassis, 6);
  const rShock1 = makeDynamicLink(0.038, MATS.steel, 8);
  const rShock2 = makeDynamicLink(0.042, MATS.shockBlue, 8);
  const rSpring = makeDynamicLink(0.056, MATS.shockRed, 8);
  suspRefs.rearArms.push({ s, trailArm, rShock1, rShock2, rSpring });
}

// -------------------------------------------------------------------------------------------------
// 4. MASSIVE 40" LOW-POLY MUD-TERRAIN TIRES + ICONIC WHITE PLAIN DISH RIMS (Exact Photo Match!)
// -------------------------------------------------------------------------------------------------
function buildTrophyWheel(isLeft) {
  const wheel = new THREE.Group();
  const s = isLeft ? -1 : 1; // outer wheel face points toward +X when right (s=1), -X when left (s=-1)

  // 4A. Chunky Low-Poly Mud-Terrain Tire Carcass (faceted torus profile)
  const rIn = 0.255, rMid = 0.39, rOut = R_TIRE - 0.022;
  const hw = W_TIRE * 0.5;
  const prof = [
    [rIn, -hw * 0.80],
    [rMid, -hw * 1.02],
    [rOut - 0.025, -hw * 0.90],
    [rOut, -hw * 0.72],
    [rOut, hw * 0.72],
    [rOut - 0.025, hw * 0.90],
    [rMid, hw * 1.02],
    [rIn, hw * 0.80],
    [rIn, -hw * 0.80],
  ].map(([r, x]) => new THREE.Vector2(r, x));
  const tireGeo = new THREE.LatheGeometry(prof, 28);
  tireGeo.rotateZ(-Math.PI / 2); // axial along X
  wheel.add(new THREE.Mesh(tireGeo, MATS.rubber));

  // 4B. Chunky Alternating Mud-Terrain Tread Blocks & Side-Biter Shoulder Lugs (merged single mesh for GLB/OBJ export!)
  const N_LUG = 24;
  const lugPos = [], lugIdx = [];
  const boxTemplates = {
    shoulder: new THREE.BoxGeometry(0.115, 0.034, 0.088),
    center:   new THREE.BoxGeometry(0.088, 0.030, 0.072),
    biter:    new THREE.BoxGeometry(0.032, 0.072, 0.068),
  };
  const dummy = new THREE.Object3D();
  const tmpV = new THREE.Vector3();
  const appendBox = (srcGeo, px, py, pz, rx, ry, rz) => {
    dummy.position.set(px, py, pz); dummy.rotation.set(rx, ry, rz); dummy.updateMatrix();
    const base = lugPos.length / 3;
    const sp = srcGeo.attributes.position;
    for (let k = 0; k < sp.count; k++) {
      tmpV.set(sp.getX(k), sp.getY(k), sp.getZ(k)).applyMatrix4(dummy.matrix);
      lugPos.push(tmpV.x, tmpV.y, tmpV.z);
    }
    const si = srcGeo.index;
    for (let k = 0; k < si.count; k++) lugIdx.push(base + si.getX(k));
  };
  for (let i = 0; i < N_LUG; i++) {
    const a = (i / N_LUG) * Math.PI * 2;
    const alt = (i % 2 === 0) ? 1 : -1;
    for (const side of [-1, 1]) {
      const aa = a + (side > 0 ? 0.5 / N_LUG * Math.PI * 2 : 0);
      const rL = R_TIRE - 0.012;
      appendBox(boxTemplates.shoulder, side * (hw * 0.55), Math.cos(aa) * rL, Math.sin(aa) * rL, aa, side * 0.24, 0);
      const rB = R_TIRE - 0.072;
      appendBox(boxTemplates.biter, side * (hw * 0.94), Math.cos(aa) * rB, Math.sin(aa) * rB, aa, 0, -side * 0.28);
    }
    const rC = R_TIRE - 0.011;
    appendBox(boxTemplates.center, alt * 0.022, Math.cos(a) * rC, Math.sin(a) * rC, a, alt * 0.3, 0);
  }
  const mergedLugs = new THREE.BufferGeometry();
  mergedLugs.setAttribute('position', new THREE.Float32BufferAttribute(lugPos, 3));
  mergedLugs.setIndex(lugIdx);
  mergedLugs.computeVertexNormals();
  wheel.add(new THREE.Mesh(mergedLugs, MATS.rubber));

  // 4C. Iconic White Deep-Dish Plain Baja Rim + Black Outer Beadlock Lip & Dark Center Hub!
  const rim = new THREE.Group();
  const Rr = 0.258;
  // Black outer beadlock ring
  const beadRing = new THREE.Mesh(new THREE.TorusGeometry(Rr - 0.012, 0.016, 8, 24), MATS.rimLip);
  beadRing.rotation.y = Math.PI / 2;
  beadRing.position.x = s * (hw * 0.72);
  rim.add(beadRing);

  // Smooth deep-dish white plain face (LatheGeometry with concave dish & recessed center hub bowl!)
  const rimPts = [
    [Rr - 0.018, hw * 0.70],
    [Rr - 0.036, hw * 0.50],
    [Rr * 0.78, hw * 0.34],
    [Rr * 0.42, hw * 0.20],
    [Rr * 0.36, hw * 0.08],
    [0.005, hw * 0.08],
  ].map(([r, x]) => new THREE.Vector2(r, s * x));
  if (s < 0) rimPts.reverse();
  const rimFaceGeo = new THREE.LatheGeometry(rimPts, 24);
  rimFaceGeo.rotateZ(-Math.PI / 2);
  rim.add(new THREE.Mesh(rimFaceGeo, MATS.rimWhite));

  // Inner dark wheel barrel drum (solid from rear views!)
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(Rr - 0.01, Rr - 0.01, hw * 1.48, 20), MATS.chassis);
  barrel.rotation.z = Math.PI / 2;
  barrel.position.x = -s * 0.02;
  rim.add(barrel);

  // Signature dark center hub bore + 6 lug studs (exact Image 1, 2, 3 match!)
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.074, 0.055, 14), MATS.chassis);
  hub.rotation.z = Math.PI / 2;
  hub.position.x = s * (hw * 0.24);
  rim.add(hub);
  const hubCap = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.072, 12), MATS.steel);
  hubCap.rotation.z = Math.PI / 2;
  hubCap.position.x = s * (hw * 0.26);
  rim.add(hubCap);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.035, 6), MATS.steel);
    lug.rotation.z = Math.PI / 2;
    lug.position.set(s * (hw * 0.22), Math.cos(a) * 0.092, Math.sin(a) * 0.092);
    rim.add(lug);
  }
  // Tiny black air valve stem inside the white rim dish
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.006, 0.032, 6), MATS.chassis);
  valve.position.set(s * (hw * 0.52), 0.195, 0.065);
  valve.rotation.z = s * 0.4;
  rim.add(valve);

  wheel.add(rim);
  return wheel;
}

// =================================================================================================
//  RIG UPDATE (SUSPENSION ARTICULATION + STEERING)
// =================================================================================================
const RIG = { susp: 0, steer: 0, drive: false, turntable: false, leds: true };

function updateRig() {
  // Body & cage travel vertically over the wheels (wheels stay grounded at y = R_TIRE!)
  const dy = RIG.susp;
  bodyGroup.position.y = dy;
  cageGroup.position.y = dy;

  // Front steering
  const rad = THREE.MathUtils.degToRad(RIG.steer);
  wheelPivots.FL.steer.rotation.y = rad;
  wheelPivots.FR.steer.rotation.y = rad;

  // Dynamic Front A-arms & Coilovers connecting moving chassis to grounded wheel hubs!
  for (const fl of suspRefs.frontLinks) {
    const s = fl.s;
    const hubTop = new THREE.Vector3(s * (X_TRACK - 0.16), R_TIRE + 0.16, Z_FRONT);
    const hubBot = new THREE.Vector3(s * (X_TRACK - 0.14), R_TIRE - 0.11, Z_FRONT);
    const chTopF = new THREE.Vector3(s * 0.42, 0.84 + dy, Z_FRONT + 0.16);
    const chTopR = new THREE.Vector3(s * 0.42, 0.84 + dy, Z_FRONT - 0.16);
    const chBotF = new THREE.Vector3(s * 0.36, 0.64 + dy, Z_FRONT + 0.20);
    const chBotR = new THREE.Vector3(s * 0.36, 0.64 + dy, Z_FRONT - 0.20);
    orientLink(fl.upperF, chTopF, hubTop);
    orientLink(fl.upperR, chTopR, hubTop);
    orientLink(fl.lowerF, chBotF, hubBot);
    orientLink(fl.lowerR, chBotR, hubBot);
    const shockTop = new THREE.Vector3(s * 0.56, 1.24 + dy, Z_FRONT - 0.04);
    const shockBot = new THREE.Vector3(s * (X_TRACK - 0.28), R_TIRE - 0.04, Z_FRONT - 0.04);
    orientLink(fl.shockBody, shockTop, shockBot);
    orientLink(fl.shockSpring, shockTop.clone().lerp(shockBot, 0.28), shockTop.clone().lerp(shockBot, 0.78));
  }

  // Dynamic Rear Trailing Arms & Twin Bypass Coilovers!
  for (const ra of suspRefs.rearArms) {
    const s = ra.s;
    const pivot = new THREE.Vector3(s * 0.54, 0.65 + dy, -0.35);
    const axlePt = new THREE.Vector3(s * 0.68, R_TIRE - 0.02, Z_REAR);
    orientLink(ra.trailArm, pivot, axlePt);
    const tower1 = new THREE.Vector3(s * 0.58, 1.36 + dy, Z_REAR + 0.06);
    const tower2 = new THREE.Vector3(s * 0.60, 1.32 + dy, Z_REAR - 0.08);
    const armMid = pivot.clone().lerp(axlePt, 0.78);
    const armRear = axlePt.clone().add(new THREE.Vector3(0, 0.04, -0.06));
    orientLink(ra.rShock1, tower1, armMid);
    orientLink(ra.rShock2, tower2, armRear);
    orientLink(ra.rSpring, tower1.clone().lerp(armMid, 0.28), tower1.clone().lerp(armMid, 0.76));
  }
}
updateRig();

function computeStats() {
  let tris = 0, verts = 0;
  TRUCK.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    const mult = o.isInstancedMesh ? o.count : 1;
    const t = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    tris += t * mult;
    verts += g.attributes.position.count * mult;
  });
  document.getElementById('stTris').innerHTML = `${Math.round(tris).toLocaleString()}<small>tris</small>`;
  document.getElementById('stVerts').innerHTML = `${Math.round(verts).toLocaleString()}<small>verts</small>`;
}

function serializeOBJandMTL(root, mtlFilename) {
  root.updateMatrixWorld(true);
  const lines = [`# Baja Trophy Truck — Game Asset (metres, Y-up, +Z forward)`, `mtllib ${mtlFilename}`];
  const usedMats = new Map();
  let vOff = 1, vtOff = 1, vnOff = 1;
  const v = new THREE.Vector3(), n = new THREE.Vector3(), nMat = new THREE.Matrix3();
  let meshIdx = 0;

  root.traverse(obj => {
    if (!obj.isMesh || !obj.geometry) return;
    const g = obj.geometry;
    const pos = g.attributes.position;
    if (!pos) return;
    const uv = g.attributes.uv;
    const norm = g.attributes.normal;
    const mat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
    const matName = (mat && mat.name) ? mat.name : 'default';
    if (mat) usedMats.set(matName, mat);

    const parentName = obj.parent?.name ? obj.parent.name + '_' : '';
    const objName = (obj.name || `${parentName}Mesh_${String(++meshIdx).padStart(3, '0')}`).replace(/\s+/g, '_');
    lines.push(`o ${objName}`);
    lines.push(`usemtl ${matName}`);

    const m = obj.matrixWorld;
    nMat.getNormalMatrix(m);
    const det = m.determinant();

    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m);
      lines.push(`v ${v.x.toFixed(5)} ${v.y.toFixed(5)} ${v.z.toFixed(5)}`);
    }
    if (uv) {
      for (let i = 0; i < uv.count; i++) lines.push(`vt ${uv.getX(i).toFixed(4)} ${uv.getY(i).toFixed(4)}`);
    }
    if (norm) {
      for (let i = 0; i < norm.count; i++) {
        n.fromBufferAttribute(norm, i).applyMatrix3(nMat).normalize();
        lines.push(`vn ${n.x.toFixed(4)} ${n.y.toFixed(4)} ${n.z.toFixed(4)}`);
      }
    }

    const fmt = idx => {
      const vi = idx + vOff;
      if (uv && norm) return `${vi}/${idx + vtOff}/${idx + vnOff}`;
      if (norm) return `${vi}//${idx + vnOff}`;
      if (uv) return `${vi}/${idx + vtOff}`;
      return `${vi}`;
    };
    const index = g.index;
    const count = index ? index.count : pos.count;
    for (let i = 0; i < count; i += 3) {
      const a = index ? index.getX(i) : i;
      const b = index ? index.getX(i + 1) : i + 1;
      const c = index ? index.getX(i + 2) : i + 2;
      lines.push(det < 0 ? `f ${fmt(a)} ${fmt(c)} ${fmt(b)}` : `f ${fmt(a)} ${fmt(b)} ${fmt(c)}`);
    }
    vOff += pos.count;
    if (uv) vtOff += uv.count;
    if (norm) vnOff += norm.count;
  });

  const mtl = [`# Material Library for Baja Trophy Truck`];
  for (const [name, mat] of usedMats.entries()) {
    const c = mat.color || new THREE.Color(0.8, 0.8, 0.8);
    const e = mat.emissive && mat.emissiveIntensity > 0 ? mat.emissive : null;
    mtl.push(`newmtl ${name}`);
    mtl.push(`Kd ${c.r.toFixed(4)} ${c.g.toFixed(4)} ${c.b.toFixed(4)}`);
    mtl.push(`Ks ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)} ${((mat.metalness || 0) * 0.8 + 0.1).toFixed(3)}`);
    mtl.push(`Ns ${Math.round((1 - (mat.roughness ?? 0.5)) * 200 + 10)}`);
    if (e) mtl.push(`Ke ${(e.r * mat.emissiveIntensity).toFixed(3)} ${(e.g * mat.emissiveIntensity).toFixed(3)} ${(e.b * mat.emissiveIntensity).toFixed(3)}`);
    mtl.push(`d 1.0`, ``);
  }
  return { obj: lines.join('\n') + '\n', mtl: mtl.join('\n') };
}

// =================================================================================================
//  RENDER LOOP
// =================================================================================================
let prevT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now;

  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 3.2);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  if (zoomTargetDist !== null) {
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length();
    const next = cur + (zoomTargetDist - cur) * (1 - Math.exp(-14 * dt));
    if (Math.abs(next - zoomTargetDist) < 0.002) { off.setLength(zoomTargetDist); zoomTargetDist = null; }
    else off.setLength(next);
    camera.position.copy(controls.target).add(off);
  }
  if (RIG.drive) {
    const spinStep = dt * 5.2;
    for (const w of Object.values(wheelPivots)) w.spin.rotation.x += spinStep;
  }
  if (RIG.turntable) TRUCK.rotation.y += dt * 0.35;

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
